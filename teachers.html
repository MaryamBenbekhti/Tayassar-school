<section class="section-padding" style="max-width: 800px; margin: auto;">
    <div class="card">
        <h2>Reserve Your Session</h2>
        <p>Select your preference below to get started.</p>
        <form action="https://formspree.io/f/xgoqveqv" method="POST">
            <label>Full Name</label>
            <input type="text" name="name" id="name" required placeholder="Enter your name">
             <label>Your Email</label>
            <input type="email" name="email" id="email" required placeholder="Enter your Email">
             <label>Your Phone Number </label>
            <input type="tel" name="phone" id="phone" required placeholder="Enter your Phone Number">
             


            <label>Select Courses</label>
            <select name="course" id="course">
                <option>Quran Recitation</option>
                <option>Arabic Language</option>
                <option>Tajweed Intensive</option>
                </select>

                <label>Preferred Teacher</label>
                <select name="teacher" id="teacher">
                    <option>Teacher Aziza</option>
                    <option>Teacher Mohammed Saleh</option>
                </select>

                <label> Time of Day (Every Thursday)</label>
                 <select name="time" id="time">
                <option>Morning 10 am - 11 am </option>
                <option>Afternoon 12 PM - 1 PM</option>
                <option>Evening 5 PM - 6 PM</option>
                </select>

                <button type="submit" class="btn btn-primary" style="width: 100% ; margin-top: 20px;"> Confirm Booking</button>
                </form>
                </div>
                </section>
            </body>
